# smith.yml — Smith project manifest. One per project directory; declares
# what the project IS, never how it is built (that's the project type's job).
version: 1

# Required. The canonical dependency identifier — other projects declare
# dependencies on this name, not on filesystem paths. Must be unique across
# the repository; Smith fails discovery on duplicate names.
name: payments

# Required. Project type from the registry, pinned to a version.
type: python/astral/service@2

# Optional. Dependencies on other projects, by name. Smith runs `targets` on
# the DEPENDENCY project before `before` targets on THIS project, then merges
# everything into the repo's target graph.
#
# Two forms, one list:
#   - auth                        # sugar: auth:build before this project's build
#   - project: database           # explicit form
#     targets: [test, lint, build]  # run these on the dependency...
#     before: [build]               # ...before these run here (both default: [build])
depends_on:
  - auth
  - project: database
    targets: [test, lint, build]
    before: [build]
  - project: auth
    targets: [run]
    before: [test]

# Optional. Values for params the project type declares (see its
# project-type.json). Keys must be declared by the type — an undeclared key
# is a hard error when a target runs. Overrides the type's default.
#
# Rendering is two-phase: param values render against the reserved computed
# vars ONLY — SMITH_REPO_ROOT (absolute repo root), SMITH_PROJECT (this
# project's name), SMITH_PROJECT_DIR (absolute path to this project). They
# may NOT reference other params. Param keys are lowercase-only, which is
# what reserves the uppercase SMITH_* names.
#
#   params:
#     config_path: '{{.SMITH_REPO_ROOT}}/pyproject.toml'
params:
  config_path: ci/pyproject.toml

# Optional. Extra environment variables for this project's target steps.
# Values are Go templates over the merged params AND the computed vars
# ({{.config_path}}, {{.SMITH_REPO_ROOT}}) and override type-level variables
# of the same name.
environment:
  PYTHONWARNDEFAULTENCODING: "1"
