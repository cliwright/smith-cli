# .smith/repo.yml — Smith repository configuration
version: 1

# Required. Identifies the monorepo (display, lock provenance).
name: name-of-monorepo

# Registry sources, in priority order: first match wins when a type or
# template exists in more than one registry. `git:` URLs today; local `path:`
# allowed for development.
registries:
  - name: cliwright
    types:     { git: https://github.com/cliwright/smith-project-types }
    templates: { git: https://github.com/cliwright/smith-project-templates }

  - name: acme-internal
    types:     { git: https://github.com/acme/smith-project-types }
    templates: { git: https://github.com/acme/smith-project-templates }

# Tools required to work in this repo, checked by `smith doctor` against PATH
# (BYOT — Smith never installs anything). `smith new` appends tools required
# by each new project's type. Project types may declare additional per-project
# tools; doctor unions both lists.
tools:
  - git
  - uv
  - docker

# Smith ONLY traverses these directories looking for smith.yml projects —
# this is what avoids node_modules/.venv hell. Seeded with defaults by
# `smith init`; `smith new` appends a root when it scaffolds somewhere not
# already listed.
workspace:
  project_roots:
    - libs
    - tools
    - services
    - images
    - infra
