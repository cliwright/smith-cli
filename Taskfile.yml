version: '3'

tasks:
  default:
    cmds:
      - task --list

  clean:
    desc: Remove existing binary from bin dir
    cmds:
      - rm -f bin/smith

  clean-types:
    desc: Remove the repo-local installed project types (they re-fetch with smith sync)
    cmds:
      - rm -rf .smith/types

  build:
    desc: "Build the smith CLI to bin/smith"
    deps: [clean]
    cmds:
      - mkdir -p bin
      - go build -o bin/smith ./cmd/smith

  test:
    desc: Run Go tests
    cmds:
      - go test ./...

  run:
    desc: Run the smith CLI (pass args after --)
    cmds:
      - go run ./cmd/smith {{.CLI_ARGS}}

  lint:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format all Go files
    cmds:
      - gofmt -w .

  docs:
    desc: Build the user guide (docs/ → site/, requires uv)
    cmds:
      - uvx zensical build

  docs:serve:
    desc: Preview the user guide at http://localhost:8000 (requires uv)
    cmds:
      - uvx zensical serve
